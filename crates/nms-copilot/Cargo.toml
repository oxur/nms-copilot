[package]
name = "nms-copilot"
description = "Interactive galactic copilot for No Man's Sky — REPL with live save file updates and MCP server"
keywords = ["nms", "no-mans-sky", "repl", "copilot", "mcp"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true

[[bin]]
name = "nms-copilot"
path = "src/main.rs"

[dependencies]
nms-core = { workspace = true }
nms-save = { workspace = true }
nms-graph = { workspace = true }
nms-cache = { workspace = true }
nms-query = { workspace = true }
nms-watch = { workspace = true }
clap = { workspace = true }
oxur-cli = { workspace = true }
tabled = { workspace = true }
dialoguer = { workspace = true }
owo-colors = { workspace = true }
dirs = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
reedline = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
fabryk-mcp = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
twyg = { workspace = true }

[features]
default = ["http"]
http = ["fabryk-mcp/http"]

[dev-dependencies]
assert_cmd = { workspace = true }
nms-save = { workspace = true }
predicates = { workspace = true }
tempfile = "3"
